name: release

# Builds the two Windows executables on every tag and attaches them to a
# GitHub release. Nothing else is needed: the loader DLL is committed, the
# server is pure Python stdlib, and PyInstaller is installed by the build
# script itself.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Also runnable by hand (workflow_dispatch) to check that a build still works
# without publishing anything.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show versions
        run: |
          python --version
          python -c "import sys; print(sys.executable)"

      - name: Build the launcher and the installer
        run: powershell -ExecutionPolicy Bypass -File packaging/build-exes.ps1

      # The supported build: extract it into the game folder and double-click
      # PLAY.bat.  It is generated from the same tree the exes come from, so it
      # cannot drift; the layout check in the script lets it run from here
      # (packaging/) instead of the development tree (tools/).
      - name: Build the PLAY.bat package (the supported build)
        shell: python
        run: |
          import subprocess, sys, os
          out = os.path.join('dist', 'Anno2070Online-playbat-%s.zip' % os.environ['GITHUB_REF_NAME'])
          sys.exit(subprocess.call([sys.executable, 'packaging/make_playbat_zip.py',
                                    '--out', out]))
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Package portable build + checksums
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Anno2070Online -DestinationPath dist/Anno2070Online-portable.zip
          $files = @(
            "dist/Anno2070Online-playbat-$env:GITHUB_REF_NAME.zip",
            'dist/Anno2070Online-Setup.exe',
            'dist/Uninstall-Anno2070Online.exe',
            'dist/Anno2070Online-portable.zip'
          )
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$h  $(Split-Path -Leaf $f)"
          }
          $lines | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
          Get-ChildItem dist | Format-Table Name, Length

      - name: Smoke-test the frozen server (no game needed)
        shell: pwsh
        run: |
          # --server mode must boot the whole server inside the frozen exe;
          # this is the failure that once produced "No module named 'json'".
          # an ABSOLUTE log dir: a relative one is resolved against the
          # package folder (not the cwd), so the old check watched a file that
          # was never written and failed a server that was perfectly healthy
          $logdir = Join-Path $PWD 'smoke-logs'
          $exe = 'dist/Anno2070Online/Anno2070Online.exe'
          $p = Start-Process -FilePath $exe -PassThru -NoNewWindow `
            -ArgumentList '--server','--config','dist/Anno2070Online/config.ini',
                          '--log-dir',$logdir,'--http','18999','--conquest','18998',
                          '--prudp-tcp','18997','--udp','0'
          $log = Join-Path $logdir 'server.log'
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            if (Test-Path $log) {
              if (Select-String -Path $log -Pattern 'HTTP  listening' -Quiet) { $ok = $true; break }
            }
            if ($p.HasExited) { break }
          }
          if (-not $ok) {
            Get-Content $log -ErrorAction SilentlyContinue
            throw 'the frozen server did not come up'
          }
          Write-Host 'frozen server came up'
          Stop-Process -Id $p.Id -Force

      - name: Smoke-test the frozen uninstaller (no game needed)
        shell: pwsh
        run: |
          # a frozen uninstaller must start, find its own runtime folder and
          # report a dry run; it never touches a real installation here
          $fake = Join-Path $env:RUNNER_TEMP 'fake-runtime'
          New-Item -ItemType Directory -Force -Path (Join-Path $fake 'server') | Out-Null
          Set-Content -Path (Join-Path $fake 'server/mimic_server.py') -Value '# fake server'
          $out = & dist/Uninstall-Anno2070Online.exe --yes --dry-run --dir $fake --no-pause 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "uninstaller exited with $LASTEXITCODE" }
          if ($out -notmatch 'nothing was changed') { throw 'uninstaller dry run printed nothing useful' }
          if (-not (Test-Path (Join-Path $fake 'server/mimic_server.py'))) {
            throw 'uninstaller deleted a folder during a dry run'
          }
          Write-Host 'frozen uninstaller works'

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: anno2070-online-windows
          path: |
            dist/Anno2070Online-playbat-*.zip
            dist/Anno2070Online-playbat-*.zip
            dist/Anno2070Online-Setup.exe
            dist/Uninstall-Anno2070Online.exe
            dist/Anno2070Online-portable.zip
            dist/SHA256SUMS.txt

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Anno 2070 - Local Online ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          body: |
            Local replacement for the shut-down Anno 2070 online backend.

            **Use `Anno2070Online-playbat-vX.Y.Z.zip` - it is the supported
            build.** Extract it so you end up with
            `...\Anno 2070\Anno2070Online\PLAY.bat` next to `Anno5.exe`,
            install Python 3.8+ once (tick *Add python.exe to PATH*), then
            double-click `PLAY.bat`:

            ```
            ...\Anno 2070\Anno5.exe
            ...\Anno 2070\Anno2070Online\PLAY.bat      <- double-click this
            ```

            It needs no admin rights and modifies no game file: `INSTALL.bat`
            puts the loader DLL next to `Anno5.exe` (keeping Ubisoft's original
            as a backup) and `PLAY.bat` starts the local server once, then the
            game.

            **Experimental, kept for the record:** `Anno2070Online-Setup.exe`
            (installs to `%LOCALAPPDATA%`, no Python needed),
            `Anno2070Online-portable.zip` (the same runtime unpacked) and
            `Uninstall-Anno2070Online.exe`. These are built by CI on every tag
            but their launcher has not been shown to behave like `PLAY.bat`, so
            prefer the PLAY.bat zip.

            **Uninstall:** `UNINSTALL.bat` in the package (or
            `Uninstall-Anno2070Online.exe` for the .exe build). It restores
            Ubisoft's original `upc_r2_loader64.dll`, keeps your online state in
            `%LOCALAPPDATA%\Anno2070Online-backup` and removes the shortcuts.
            `/purge` drops the state too. Your savegames are never touched.

            **Verify:** `SHA256SUMS.txt` has the hash of every file;
            `SELFTEST.bat` runs a full fake session in a temp folder (career,
            ARK, events, mail, restart) and never touches your save;
            `PROGRESS.bat` prints what was saved and probes the running server.

            What works: online session, career reputation (votes, missions,
            campaign tiers, daily quests, election gifts - all persisted), ARK
            item box, senate and World Council elections with a simulated
            electorate, month-long world events whose bar is a feed of mission
            completions (including your own), profile, chat/friends/mail,
            achievements, statistics.

            Known limits: about 4 launches in 10 come up offline (quit from the
            menu and start again; nothing is lost), the Ark Politics tab is
            gated client-side, and conquest/multiplayer is not reachable. See
            `docs/known-issues.md` in the source.

            Not affiliated with Ubisoft. Contains no game code, data or assets.
          files: |
            dist/Anno2070Online-playbat-*.zip
            dist/Anno2070Online-Setup.exe
            dist/Uninstall-Anno2070Online.exe
            dist/Anno2070Online-portable.zip
            dist/SHA256SUMS.txt
