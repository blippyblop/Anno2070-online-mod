name: tests

# The suites are offline: no game, no Windows, no network. They cover the wire
# shapes (independent decoders), the gameplay content, the RMC service layer
# and the conquest HTTP channel.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  suites:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run every suite
        run: bash tests/run_all.sh
      - name: Byte-compile everything (catches syntax that only bites on import)
        run: python -m compileall -q server tests
