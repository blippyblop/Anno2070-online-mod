; =====================================================================
;  Anno 2070 - Local Online  ::  config.ini
;
;  This is the only file you normally need to edit.
;  Lines starting with ';' or '#' are comments.
; =====================================================================

[player]
; The name you want to appear online (profile name / chat name).
; Up to 32 characters. Letters, digits, spaces, '-', '_' and '.' are safe.
name = Player

[game]
; Where Anno 2070 is installed. INSTALL.bat / PLAY.bat copy the loader DLL
; into this folder. Leave it blank to auto-detect the usual Steam / Ubisoft
; locations.
path =

[server]
; Addresses and ports. The game is patched to talk to 127.0.0.1 on these
; ports, so only change them if you know you need to (and then also rebuild
; the loader, see docs/install.md).
bind_address = 127.0.0.1
http_port = 8443
conquest_port = 3080
prudp_port = 3091
udp_port = 3090

; Where the server keeps its log and its saved state (ARK items, elections,
; world events). Relative paths are used as-is.
log_dir = logs
state_file = server/state.json

[options]
; The notification that delivers Anno's server addresses to the game.
; Leave on; set to 0 only when diagnosing a problem.
notification_push = 1

; Verbose protocol capture (large logs). Off is the normal setting.
diagnostics = 0
